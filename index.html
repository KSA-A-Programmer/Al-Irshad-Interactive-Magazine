<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مجلة مدرستنا | العدد الثاني التفاعلي</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">📖 مجلة مدرستنا <small>العدد الثاني • النسخة التفاعلية</small></div><div class="actions"><button id="save">☁️ إرسال الإجابات</button><button id="pdf">⬇️ حفظ PDF</button><button id="reset" title="مسح الإجابات المحفوظة على هذا الجهاز">↺ بدء جديد</button></div></header>
<div class="hint" id="notice">اضغطي على مربعات الاختيار أو أماكن الإجابة. لإضافة إجابة في أي موضع آخر اختاري «إضافة كتابة» ثم اضغطي على الصفحة. تُحفظ الإجابات على هذا الجهاز تلقائيًا.</div>
<main><aside class="tools"><button id="write" class="tool">✏️ إضافة كتابة</button><button id="check" class="tool">✓ إضافة علامة</button><button id="cancel" class="tool">✋ تصفح</button><button id="undo" class="tool">↶ حذف آخر إضافة</button><div class="setting"><label for="scale">حجم الكتابة</label><input id="scale" type="range" min="12" max="52" value="27"></div><p>الكتابة والإشارات تظهر فوق الصفحة الأصلية فقط، ولا تُعدل المجلة نفسها.</p></aside><section class="reader"><div class="page-wrap" id="pageWrap"><img id="pageImage" alt="صفحة المجلة"><div id="overlay" class="overlay"></div></div><nav><button id="prev">❮ السابقة</button><span id="counter">1 / 29</span><button id="next">التالية ❯</button></nav></section></main>
<div id="printArea"></div><script src="app.js"></script></body></html>
